:focus-visible{outline:3px solid var(--blue);outline-offset:2px}@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}}

<body>
<div class="app">
<section id="home" class="screen active">
  <header class="topbar"><div class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></svg></div><div><div class="brand-name">Приложуха</div><div class="brand-caption">твой день под контролем</div></div><button class="profile" aria-label="Профиль">Л</button></header>
  <div class="section-heading"><div><p class="eyebrow" id="todayDate"></p><h1 class="page-title">Сегодня</h1></div><button class="header-action" aria-label="Открыть календарь" onclick="openCalendar()">···</button></div>
  <div class="tasks-card"><div class="tasks-heading"><h2 class="title">Задачи</h2><span class="task-count" id="taskCount"></span></div><div id="homeTasks"></div></div>
  <div class="grid">
    <div class="card"><div class="card-title-row"><span class="section-icon goal-icon">◎</span><h2>Цели</h2></div><div id="goals"></div><button class="add-btn" onclick="openGoal()">＋ Добавить цель</button></div>
    <div class="card analytics"><div class="card-title-row"><span class="section-icon analytics-icon">↗</span><h2>Баланс</h2><div class="chart-summary"><div class="chart-balance" id="chartBalance">0 ₽</div><div class="chart-trend flat" id="chartTrend" aria-live="polite">→ 0%</div></div></div>
      <div class="chart-periods" role="group" aria-label="Период графика"><button class="chart-period" data-period="week" onclick="setChartPeriod('week')">Неделя</button><button class="chart-period" data-period="month" onclick="setChartPeriod('month')">Месяц</button><button class="chart-period" data-period="season" onclick="setChartPeriod('season')"><span id="seasonPeriodLabel">Сезон</span></button><button class="chart-period" data-period="year" onclick="setChartPeriod('year')">Год</button><button class="chart-period" data-period="all" onclick="setChartPeriod('all')">Всё</button></div>
      <div class="chart"><svg id="balanceChart" viewBox="0 0 320 120" preserveAspectRatio="none" role="img" aria-label="График изменения общего баланса"></svg></div>
      <div class="chart-detail" id="chartDetail" aria-live="polite"></div>
      <div class="ops" id="operations"></div>
      <button class="add-btn" onclick="openOperation()">＋ Добавить операцию</button>
    </div>
  </div>
  <nav class="bottom">
    <button class="nav active" aria-label="Главная" onclick="show('home')"><svg viewBox="0 0 32 32"><path d="M5 14 16 5l11 9v12H18v-8h-4v8H5z"/></svg><span class="nav-label">Главная</span></button>
    <button class="nav" aria-label="Задачи" onclick="show('tasks')"><svg viewBox="0 0 32 32"><path d="M6 17l6 6L27 8"/><rect x="4" y="4" width="24" height="24" rx="4"/></svg><span class="nav-label">Задачи</span></button>
    <button class="nav" aria-label="Финансы" onclick="show('finance')"><svg viewBox="0 0 32 32"><ellipse cx="16" cy="7" rx="10" ry="4"/><path d="M6 7v17c0 2 20 2 20 0V7M6 15c0 2 20 2 20 0"/></svg><span class="nav-label">Финансы</span></button>
    <button class="nav" aria-label="Статистика" onclick="toast('Аналитика — следующий экран')"><svg viewBox="0 0 32 32"><path d="M6 26V6M6 26h21"/><path d="M8 21 13 16l4 3 8-10"/></svg><span class="nav-label">Статистика</span></button>
    <button class="nav" aria-label="Дневник" onclick="toast('Дневник — следующий экран')"><svg viewBox="0 0 32 32"><path d="M6 5h15l5 5v17H6zM21 5v6h5M10 16h12M10 21h12"/></svg><span class="nav-label">Дневник</span></button>
  </nav>
</section>

<script>
const defaults={tasks:['сделать домашку','сходить в зал','еще что нибудь'],goals:[],operations:[]};
let storedData=JSON.parse(localStorage.getItem('prilozhuhaData')||'null');
let data={...defaults,...(storedData||{})};
if(!Array.isArray(data.tasks))data.tasks=[];if(!Array.isArray(data.goals))data.goals=[];if(!Array.isArray(data.operations))data.operations=[];
function save(){localStorage.setItem('prilozhuhaData',JSON.stringify(data));render()}
function render(){
  homeTasks.innerHTML=data.tasks.slice(0,3).map(t=>{const text=taskText(t),done=taskDone(t),subs=taskSubtasks(t),due=taskDue(t);return `<div class="${done?'task-entry completed':'task-entry'}"><div class="task-row"><span class="bullet"></span><span class="task-text">${esc(text)}</span></div>${due?`<div class="task-preview-meta ${due.overdue?'overdue':''}">${due.label}</div>`:''}${subs.length?`<div class="task-preview-meta">${subs.filter(subtaskDone).length} из ${subs.length} подзадач</div>`:''}</div>`}).join('');
  taskCount.textContent=data.tasks.length?`${data.tasks.length} ${data.tasks.length===1?'задача':'задачи'}`:'Пока пусто';
  taskList.innerHTML=data.tasks.map((t,i)=>{const text=taskText(t),done=taskDone(t),subs=taskSubtasks(t),due=taskDue(t);return `<div class="task-entry ${done?'completed':''}" data-i="${i}"><div class="task-main"><div class="task-body"><div class="task-name">${esc(text)}</div>${due?`<div class="task-meta ${due.overdue?'overdue':''}">${due.label}</div>`:''}${subs.length?`<div class="task-meta">${subs.filter(subtaskDone).length} из ${subs.length} подзадач</div>`:''}</div><span class="task-actions"><button class="action delete" aria-label="Удалить задачу" onclick="removeTask(${i})">×</button><button class="action done" aria-label="Изменить выполнение" onclick="doneTask(${i})">✓</button><button class="action edit" aria-label="Изменить название" onclick="editTask(${i})">⌕</button></span></div>${subs.length?`<div class="subtasks">${subs.map((s,j)=>`<button class="subtask-row" aria-pressed="${subtaskDone(s)}" onclick="toggleSubtask(${i},${j})"><span class="subtask-check ${subtaskDone(s)?'checked':''}">${subtaskDone(s)?'✓':''}</span><span class="subtask-text ${subtaskDone(s)?'checked':''}">${esc(subtaskText(s))}</span></button>`).join('')}</div>`:''}<button class="subtask-add" onclick="addSubtask(${i})">＋ Добавить подзадачу</button></div>`}).join('');
  goals.innerHTML=data.goals.map((g,i)=>{let price=Number(g.price)||0,saved=Number(g.saved)||0,pct=price?Math.min(100,saved/price*100):0,complete=price>0&&saved>=price;return `<div class="${complete?'goal-complete':''}"><div class="goal-name-row"><div class="goal">${complete?'✓':'•'} ${esc(g.name)}</div><button class="goal-delete" aria-label="Удалить цель: ${esc(g.name)}" onclick="deleteGoal(${i})"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6m4-6v6M5 7l1 14h12l1-14M9 7V4h6v3"/></svg></button></div><div class="goal-money">${fmt(saved)} / ${fmt(price)} ₽${complete?' · достигнута':''}</div><div class="progress"><div class="progress-fill" style="width:${pct}%"></div></div></div>`}).join('');
  const balance=getBalance();balanceAmount.textContent=`${balance<0?'−':''}${fmt(Math.abs(balance))} ₽`;
  financeGoals.innerHTML=data.goals.map((g,i)=>goalCard(g,i)).join('')||'<div class="empty-state">Пока нет целей. Добавь цель, чтобы видеть план накоплений.</div>';
  const operationRows=data.operations.slice(0,8).map(operationCard).join('')||'<div class="empty-state">Операций пока нет</div>';
  financeOperations.innerHTML=operationRows;
  operations.innerHTML=data.operations.map(o=>`<p class="op ${o.type==='minus'?'minus':'plus'}">${o.icon?esc(o.icon)+' ':''}${o.type==='minus'?'−':'+'}${fmt(o.amount)} ₽<br>${esc(o.name)}${o.category?` · ${esc(o.category)}`:''}</p>`).join('')||'<p class="op" style="color:#bbb">пока нет операций</p>';
  renderChart();
}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function fmt(n){return Number(n).toLocaleString('ru-RU')}
function getBalance(){return data.operations.reduce((total,o)=>total+(o.type==='plus'?Number(o.amount)||0:-(Number(o.amount)||0)),0)}
let chartSeries=[],selectedChartPeriod='week';
function chartDateLabel(date,index){if(!date)return `Операция ${index+1}`;const parsed=new Date(date);return Number.isNaN(parsed.getTime())?`Операция ${index+1}`:new Intl.DateTimeFormat('ru-RU',{day:'numeric',month:'short'}).format(parsed)}
function seasonInfo(now){const month=now.getMonth(),year=now.getFullYear();if(month===11)return{label:'Зима',start:new Date(year,11,1)};if(month<=1)return{label:'Зима',start:new Date(year-1,11,1)};if(month<=4)return{label:'Весна',start:new Date(year,2,1)};if(month<=7)return{label:'Лето',start:new Date(year,5,1)};return{label:'Осень',start:new Date(year,8,1)}}
function chartPeriodInfo(period,now){const today=new Date(now.getFullYear(),now.getMonth(),now.getDate());if(period==='week')return{label:'Неделя',start:new Date(now.getTime()-7*86400000),axis:'7 дней назад'};if(period==='month')return{label:'Месяц',start:new Date(now.getTime()-30*86400000),axis:'30 дней назад'};if(period==='season'){const season=seasonInfo(now);return{label:season.label,start:season.start,axis:chartDateLabel(season.start,0)}}if(period==='year')return{label:'Год',start:new Date(now.getFullYear(),0,1),axis:'1 янв.'};return{label:'Всё',start:null,axis:'Начало'}}
function setChartPeriod(period){selectedChartPeriod=period;renderChart()}
function renderChart(){
 const svg=document.getElementById('balanceChart'),total=getBalance(),now=new Date(),period=chartPeriodInfo(selectedChartPeriod,now),day=86400000;
 chartBalance.textContent=`${total<0?'−':''}${fmt(Math.abs(total))} ₽`;
 const season=seasonInfo(now);seasonPeriodLabel.textContent=season.label;
 document.querySelectorAll('.chart-period').forEach(button=>{const active=button.dataset.period===selectedChartPeriod;button.classList.toggle('active',active);button.setAttribute('aria-pressed',String(active))});
 const indexed=data.operations.map((op,index)=>({op,index,time:op.date?Date.parse(op.date):NaN}));
 const dated=indexed.filter(item=>Number.isFinite(item.time)).sort((a,b)=>a.time-b.time||b.index-a.index);
 const undated=indexed.filter(item=>!Number.isFinite(item.time)).reverse();
 let ordered;
 if(selectedChartPeriod==='all'){
   const earliestKnown=dated.length?dated[0].time:now.getTime()-Math.max(7,undated.length)*day;
   ordered=[...undated.map((item,index)=>({...item,time:earliestKnown-(undated.length-index)*day,label:'Без даты'})),...dated];
 }else ordered=dated.filter(item=>item.time>=period.start.getTime()&&item.time<=now.getTime()).map(item=>({...item,label:chartDateLabel(item.op.date,item.index)}));
 const net=ordered.reduce((sum,item)=>sum+(item.op.type==='plus'?1:-1)*(Number(item.op.amount)||0),0),opening=total-net,lastOperation=ordered[ordered.length-1],lastDelta=lastOperation?(lastOperation.op.type==='plus'?1:-1)*(Number(lastOperation.op.amount)||0):0,balanceBeforeLast=total-lastDelta,changePct=lastDelta?Math.abs(lastDelta)/(Math.abs(balanceBeforeLast)||Math.abs(lastDelta))*100:0;
 chartTrend.className=`chart-trend ${lastDelta>0?'up':lastDelta<0?'down':'flat'}`;chartTrend.textContent=`${lastDelta>0?'↑':lastDelta<0?'↓':'→'} ${new Intl.NumberFormat('ru-RU',{minimumFractionDigits:1,maximumFractionDigits:1}).format(changePct)}%`;chartTrend.title='Изменение от последней операции за выбранный период';chartTrend.setAttribute('aria-label',lastDelta>0?`Последний доход увеличил баланс на ${chartTrend.textContent.slice(2)}`:lastDelta<0?`Последний расход уменьшил баланс на ${chartTrend.textContent.slice(2)}`:'За период нет изменений баланса');
 if(!data.operations.length){chartSeries=[];svg.setAttribute('aria-label',`Операций пока нет. Общий баланс ${fmt(total)} рублей.`);svg.innerHTML='<line class="chart-grid" x1="18" y1="94" x2="302" y2="94"/><text class="chart-empty" x="160" y="54" text-anchor="middle">Добавь доход или расход</text><text class="chart-axis" x="160" y="70" text-anchor="middle">здесь появится динамика баланса</text>';chartDetail.textContent='Баланс сейчас: 0 ₽ · Пока нет операций.';return}
 const startTime=period.start?period.start.getTime():ordered.length?Math.min(ordered[0].time,now.getTime()-day):now.getTime()-7*day,endTime=Math.max(startTime+1,now.getTime());
 chartSeries=[{kind:'start',balance:opening,time:startTime,label:period.axis,name:'Баланс в начале периода'}];let running=opening;
 ordered.forEach(item=>{const {op,index,time,label}=item,amount=Number(op.amount)||0;running+=op.type==='plus'?amount:-amount;chartSeries.push({kind:'operation',balance:running,time,op,index,label:label||chartDateLabel(op.date,index),name:op.name||'Операция'})});
 chartSeries.push({kind:'current',balance:total,time:now.getTime(),label:'Сейчас',name:'Текущий баланс'});
 const values=chartSeries.map(point=>point.balance);let min=Math.min(...values),max=Math.max(...values);if(min===max){const pad=Math.max(1,Math.abs(min)*.05);min-=pad;max+=pad}else{const pad=(max-min)*.1;min-=pad;max+=pad}
 const left=18,right=302,top=12,bottom=92,range=endTime-startTime;
 chartSeries=chartSeries.map(point=>({...point,x:left+Math.max(0,Math.min(1,(point.time-startTime)/range))*(right-left),y:bottom-((point.balance-min)/(max-min))*(bottom-top)}));
 const grid=[.25,.5,.75].map(f=>{const y=top+(bottom-top)*f;return `<line class="chart-grid" x1="${left}" y1="${y}" x2="${right}" y2="${y}"/>`}).join('');
 const path=chartSeries.map((point,index)=>`${index?'L':'M'}${point.x.toFixed(2)},${point.y.toFixed(2)}`).join(' ');
 const marks=chartSeries.map((point,index)=>`<g class="chart-point" data-index="${index}" tabindex="0" role="button" aria-label="${point.kind==='start'?`${esc(point.label)}: ${fmt(point.balance)} рублей`:point.kind==='current'?`Текущий баланс: ${fmt(point.balance)} рублей`:`${esc(point.label)}; баланс ${fmt(point.balance)} рублей`}"><circle class="chart-hit" cx="${point.x}" cy="${point.y}" r="10"/><circle class="chart-dot" cx="${point.x}" cy="${point.y}" r="3.5"/></g>`).join('');
 const firstLabel=period.axis,lastLabel=chartDateLabel(now.toISOString(),0);
 svg.setAttribute('aria-label',`Изменение баланса за период «${period.label}» по ${ordered.length} операциям. Текущий баланс ${fmt(total)} рублей.`);
 svg.innerHTML=`${grid}<line id="chartCrosshair" class="chart-crosshair" x1="${right}" y1="${top}" x2="${right}" y2="${bottom}" visibility="hidden"/><path class="chart-line" d="${path}"/>${marks}<text class="chart-axis" x="${left}" y="111" text-anchor="start">${esc(firstLabel)}</text><text class="chart-axis" x="${right}" y="111" text-anchor="end">${esc(lastLabel)}</text>`;
 svg.querySelectorAll('.chart-point').forEach(point=>{const select=()=>showChartPoint(Number(point.dataset.index));point.addEventListener('click',select);point.addEventListener('pointerenter',select);point.addEventListener('focus',select);point.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();select()}})});
 showChartPoint(chartSeries.length-1);if(!ordered.length)chartDetail.textContent=`За период «${period.label}» операций нет · баланс ${fmt(total)} ₽`;
}
function showChartPoint(index){const point=chartSeries[index];if(!point)return;document.querySelectorAll('.chart-point').forEach((item,i)=>item.classList.toggle('selected',i===index));const crosshair=document.getElementById('chartCrosshair');if(crosshair){crosshair.setAttribute('x1',point.x);crosshair.setAttribute('x2',point.x);crosshair.setAttribute('visibility','visible')}if(point.kind==='start'){chartDetail.textContent=`${point.name}: ${fmt(point.balance)} ₽`;return}if(point.kind==='current'){chartDetail.textContent=`Текущий общий баланс: ${fmt(point.balance)} ₽`;return}const op=point.op,sign=op.type==='plus'?'+':'−',date=op.date?`${chartDateLabel(op.date,point.index)} · `:'';chartDetail.textContent=`${date}${op.icon||''} ${op.name||'Операция'} · ${sign}${fmt(op.amount)} ₽${op.category?' · '+op.category:''} · баланс после операции: ${fmt(point.balance)} ₽`}
function goalCard(g,i){let price=Number(g.price)||0,saved=Number(g.saved)||0,pct=price?Math.min(100,saved/price*100):0,remaining=Math.max(0,price-saved),complete=price>0&&saved>=price,date=g.date?new Date(`${g.date}T00:00:00`):null,today=new Date();today.setHours(0,0,0,0);let days=date?Math.max(1,Math.ceil((date-today)/86400000)):0,daily=date?Math.ceil(remaining/days):0,dateText=date?`До ${new Intl.DateTimeFormat('ru-RU',{day:'numeric',month:'long'}).format(date)}`:'Без срока',savingText=complete?'Цель достигнута 🎉':date?(date<today?'Срок прошёл':`Откладывай ${fmt(daily)} ₽ в день`):`Осталось ${fmt(remaining)} ₽`;return `<div class="finance-goal ${complete?'finance-goal-complete':''}"><div class="finance-goal-heading"><span class="finance-goal-emoji">${esc(g.icon||'🎯')}</span><div class="finance-goal-name">${esc(g.name)}<div class="finance-goal-date">${dateText}</div></div><strong>${Math.round(pct)}%</strong><button class="goal-delete" aria-label="Удалить цель: ${esc(g.name)}" onclick="deleteGoal(${i})"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6m4-6v6M5 7l1 14h12l1-14M9 7V4h6v3"/></svg></button></div><div class="goal-money">${fmt(saved)} из ${fmt(price)} ₽ · осталось ${fmt(remaining)} ₽</div><div class="progress"><div class="progress-fill" style="width:${pct}%"></div></div><div class="daily-saving">${savingText}</div><div class="goal-tools">${complete?'':`<button class="deposit-button" onclick="openGoalMovement(${i},'deposit')">＋ Отложить</button>`}<button class="withdraw-button" onclick="openGoalMovement(${i},'withdraw')">↗ Вернуть в баланс</button></div></div>`}
function deleteGoal(index){const goal=data.goals[index];if(!goal)return;const saved=Number(goal.saved)||0,refund=saved>0?` ${fmt(saved)} ₽ из цели вернутся в общий баланс.`:' ';if(!confirm(`Удалить цель «${goal.name}»?${refund}`))return;if(saved>0)data.operations.unshift({name:`Возврат при удалении цели «${goal.name}»`,amount:saved,type:'plus',category:'Возврат из цели',icon:'↩️',date:new Date().toISOString()});data.goals.splice(index,1);save();toast('Цель удалена')}
function operationCard(o){return `<div class="finance-operation"><span class="operation-icon">${esc(o.icon|| (o.type==='minus'?'🛍️':'💵'))}</span><div class="operation-info"><div class="operation-name">${esc(o.name||'Операция')}</div><div class="operation-category">${esc(o.category||'Без категории')}</div></div><div class="operation-amount ${o.type==='minus'?'minus':'plus'}">${o.type==='minus'?'−':'+'}${fmt(o.amount)} ₽</div></div>`}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');const activeIndex={home:0,tasks:1,finance:2}[id];document.querySelectorAll('.bottom').forEach(nav=>nav.querySelectorAll('.nav').forEach((button,index)=>button.classList.toggle('active',index===activeIndex)))}
function openGoal(){
 const icons=['🎯','💰','🏠','🚗','✈️','🎓','🎮','📱','💻','🚲','🎁','⭐'];window.selectedGoalIcon='🎯';modalContent.innerHTML=`<h3>Новая цель</h3><div class="field"><label>Название</label><input id="gname" placeholder="Например, велосипед"></div><div class="field"><label>Нужно накопить, ₽</label><input id="gprice" type="number" min="1" step="1" placeholder="20000"></div><div class="field"><label>Иконка</label><div class="goal-icon-picker">${icons.map((icon,index)=>`<button type="button" class="goal-icon-choice ${index===0?'selected':''}" aria-label="Иконка ${icon}" aria-pressed="${index===0}" onclick="selectGoalIcon('${icon}',this)">${icon}</button>`).join('')}</div></div><div class="field"><label>К какой дате накопить</label><input id="gdate" type="date"></div><div class="modal-actions"><button class="cancel" onclick="closeModal()">Отмена</button><button class="save" onclick="saveGoal()">Добавить</button></div>`;modal.classList.add('show');gname.focus()
}
function selectGoalIcon(icon,button){window.selectedGoalIcon=icon;document.querySelectorAll('.goal-icon-choice').forEach(choice=>{const selected=choice===button;choice.classList.toggle('selected',selected);choice.setAttribute('aria-pressed',String(selected))})}
function saveGoal(){let name=gname.value.trim(),price=+gprice.value,date=gdate.value,icon=window.selectedGoalIcon||'🎯';if(!name||!Number.isFinite(price)||price<=0){toast('Укажи название и сумму больше нуля');return}data.goals.push({name,price,saved:0,date,icon});closeModal();save();toast('Цель добавлена')}
function openOperation(type='minus'){
 const categories=type==='minus'?['Еда','Транспорт','Покупки','Здоровье','Учёба','Развлечения','Другое']:['Зарплата','Подарок','Подработка','Возврат','Другое'];
 modalContent.innerHTML=`<h3>${type==='minus'?'Новый расход':'Новый доход'}</h3><div class="field"><label>Наименование</label><input id="oname" placeholder="Например, обед"></div><div class="field"><label>Сумма, ₽</label><input id="oamount" type="number" min="1" step="1" inputmode="decimal" placeholder="500"></div><div class="field"><label>Категория</label><select id="ocategory">${categories.map(c=>`<option>${c}</option>`).join('')}</select></div><div class="field"><label>Иконка (эмодзи)</label><input id="oicon" maxlength="8" placeholder="${type==='minus'?'🛍️':'💵'}"></div><div class="modal-actions"><button class="cancel" onclick="closeModal()">Отмена</button><button class="save" onclick="saveOperation()">Добавить</button></div>`;window.opType=type;modal.classList.add('show');oname.focus()
}
function saveOperation(){let name=oname.value.trim(),amount=+oamount.value,category=ocategory.value,icon=oicon.value.trim()||(window.opType==='minus'?'🛍️':'💵');if(!name||!Number.isFinite(amount)||amount<=0){toast('Укажи название и сумму больше нуля');return}data.operations.unshift({name,amount,type:window.opType,category,icon,date:new Date().toISOString()});closeModal();save();toast(window.opType==='minus'?'Расход добавлен':'Доход добавлен')}
function openGoalMovement(index,kind){let g=data.goals[index],deposit=kind==='deposit';modalContent.innerHTML=`<h3>${deposit?'Пополнить цель':'Вернуть деньги'}</h3><div class="field"><label>Цель</label><input value="${esc(g.name)}" disabled></div><div class="field"><label>Сумма, ₽</label><input id="mamount" type="number" min="1" max="${deposit?'':Number(g.saved)||0}" step="1" inputmode="decimal" placeholder="1000"></div>${deposit?`<div class="field"><label>Откуда взять деньги</label><div class="type-buttons"><button id="sourceBalance" class="selected" onclick="setGoalSource('balance')">Из баланса</button><button id="sourceOther" onclick="setGoalSource('other')">Другой источник</button></div><div class="hint" id="sourceHint">Сумма спишется с общего баланса.</div></div>`:'<div class="hint">Сумма будет добавлена обратно в общий баланс.</div>'}<div class="modal-actions"><button class="cancel" onclick="closeModal()">Отмена</button><button class="save" onclick="saveGoalMovement(${index},'${kind}')">${deposit?'Отложить':'Вернуть'}</button></div>`;window.goalSource='balance';modal.classList.add('show');mamount.focus()}
function setGoalSource(source){window.goalSource=source;sourceBalance.classList.toggle('selected',source==='balance');sourceOther.classList.toggle('selected',source==='other');sourceHint.textContent=source==='balance'?'Сумма спишется с общего баланса.':'Укажи пополнение из другого источника: общий баланс не изменится.'}
function saveGoalMovement(index,kind){let goal=data.goals[index],amount=Number(mamount.value);if(!Number.isFinite(amount)||amount<=0){toast('Укажи сумму больше нуля');return}if(kind==='deposit'){if(window.goalSource==='balance'&&amount>getBalance()){toast('На общем балансе недостаточно средств');return}goal.saved=(Number(goal.saved)||0)+amount;if(window.goalSource==='balance')data.operations.unshift({name:`В цель «${goal.name}»`,amount,type:'minus',category:'Накопления',icon:'🎯',date:new Date().toISOString()})}else{if(amount>(Number(goal.saved)||0)){toast('В цели меньше средств, чем указано');return}goal.saved=(Number(goal.saved)||0)-amount;data.operations.unshift({name:`Из цели «${goal.name}»`,amount,type:'plus',category:'Возврат из цели',icon:'↩️',date:new Date().toISOString()})}closeModal();save();toast(kind==='deposit'?'Цель пополнена':'Деньги возвращены в баланс')}
function closeModal(){modal.classList.remove('show');modalContent.classList.remove('calendar-modal')}
function taskText(task){return typeof task==='string'?task:String(task?.text||'Без названия')}
function taskDone(task){return typeof task==='object'&&!!task.done}
function taskSubtasks(task){return typeof task==='object'&&Array.isArray(task.subtasks)?task.subtasks:[]}
function subtaskText(subtask){return typeof subtask==='string'?subtask:String(subtask?.text||'')}
function subtaskDone(subtask){return typeof subtask==='object'&&!!subtask.done}
function taskDue(task){if(typeof task==='string'||!task.dueDate)return null;const date=new Date(`${task.dueDate}T00:00:00`);if(Number.isNaN(date.getTime()))return null;const today=new Date();today.setHours(0,0,0,0);const diff=Math.round((date-today)/86400000),done=taskDone(task),label=diff===0?'Срок: сегодня':diff===1?'Срок: завтра':`Срок: ${new Intl.DateTimeFormat('ru-RU',{day:'numeric',month:'long'}).format(date)}`;return{label:diff<0&&!done?`Просрочена · ${new Intl.DateTimeFormat('ru-RU',{day:'numeric',month:'long'}).format(date)}`:label,overdue:diff<0&&!done}}
function ensureTask(index){let task=data.tasks[index];if(typeof task==='string')task=data.tasks[index]={text:task,dueDate:'',subtasks:[],done:false};if(!Array.isArray(task.subtasks))task.subtasks=[];return task}
function addTask(){
 modalContent.innerHTML=`<h3>Новая задача</h3><div class="field"><label for="newTaskName">Название</label><input id="newTaskName" placeholder="Например, сделать домашнее задание"></div><div class="field"><label for="newTaskDate">Когда выполнить</label><input id="newTaskDate" type="date"></div><div class="field"><label>Подзадачи</label><div class="subtask-fields" id="newTaskSubtasks"></div><button class="subtask-add" onclick="addTaskSubtaskField()">＋ Добавить подзадачу</button></div><div class="modal-actions"><button class="cancel" onclick="closeModal()">Отмена</button><button class="save" onclick="saveTask()">Добавить</button></div>`;modal.classList.add('show');document.getElementById('newTaskName').focus()
}
function addTaskSubtaskField(value=''){const container=document.getElementById('newTaskSubtasks');if(!container)return;const row=document.createElement('div');row.className='subtask-field';const input=document.createElement('input');input.className='subtask-input';input.placeholder='Название подзадачи';input.value=value;input.setAttribute('aria-label','Название подзадачи');const remove=document.createElement('button');remove.type='button';remove.textContent='×';remove.setAttribute('aria-label','Удалить подзадачу');remove.onclick=()=>row.remove();row.append(input,remove);container.append(row);input.focus()}
function saveTask(){const name=document.getElementById('newTaskName').value.trim(),dueDate=document.getElementById('newTaskDate').value,subtasks=[...document.querySelectorAll('#newTaskSubtasks .subtask-input')].map(input=>input.value.trim()).filter(Boolean).map(text=>({text,done:false}));if(!name){toast('Укажи название задачи');return}data.tasks.push({text:name,dueDate,subtasks,done:false});closeModal();save();toast('Задача добавлена')}
function removeTask(i){data.tasks.splice(i,1);save();toast('Задача удалена')}
function setTaskDone(task,done){task.done=done;task.completedAt=done?new Date().toISOString():''}
function doneTask(i){const task=ensureTask(i),next=!task.done;if(task.subtasks.length)task.subtasks=task.subtasks.map(subtask=>({text:subtaskText(subtask),done:next}));setTaskDone(task,next);save();toast(next?'Задача выполнена':'Задача снова активна')}
function toggleSubtask(i,j){const task=ensureTask(i),subtask=task.subtasks[j];task.subtasks[j]={text:subtaskText(subtask),done:!subtaskDone(subtask)};const complete=task.subtasks.length>0&&task.subtasks.every(subtaskDone);setTaskDone(task,complete);save();if(task.done)toast('Все подзадачи выполнены')}
function addSubtask(i){ensureTask(i);modalContent.innerHTML=`<h3>Новая подзадача</h3><div class="field"><label for="newSubtaskName">Название</label><input id="newSubtaskName" placeholder="Например, прочитать параграф"></div><div class="modal-actions"><button class="cancel" onclick="closeModal()">Отмена</button><button class="save" onclick="saveSubtask(${i})">Добавить</button></div>`;modal.classList.add('show');document.getElementById('newSubtaskName').focus()}
function saveSubtask(i){const name=document.getElementById('newSubtaskName').value.trim();if(!name){toast('Укажи название подзадачи');return}const task=ensureTask(i);task.subtasks.push({text:name,done:false});setTaskDone(task,false);closeModal();save();toast('Подзадача добавлена')}
function editTask(i){const task=ensureTask(i),n=prompt('Измени задачу:',task.text);if(n&&n.trim()){task.text=n.trim();save()}}
let calendarMonth=new Date(new Date().getFullYear(),new Date().getMonth(),1),calendarSelected=localDateKey(new Date());
function localDateKey(date){return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`}
function openCalendar(){calendarMonth=new Date(new Date().getFullYear(),new Date().getMonth(),1);calendarSelected=localDateKey(new Date());modalContent.classList.add('calendar-modal');modal.classList.add('show');renderCalendar()}
function calendarTaskState(dateKey){const tasks=data.tasks.filter(task=>typeof task!=='string'&&task.dueDate===dateKey);if(!tasks.length)return'';const allDone=tasks.every(taskDone);return allDone?'finished':'missed'}
function renderCalendar(){const year=calendarMonth.getFullYear(),month=calendarMonth.getMonth(),first=new Date(year,month,1),days=new Date(year,month+1,0).getDate(),offset=(first.getDay()+6)%7,today=localDateKey(new Date()),monthLabel=new Intl.DateTimeFormat('ru-RU',{month:'long',year:'numeric'}).format(first);const weekdays=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(day=>`<span>${day}</span>`).join(''),empty=Array.from({length:offset},()=>'<span class="calendar-empty"></span>').join('');const cells=Array.from({length:days},(_,index)=>{const day=index+1,key=localDateKey(new Date(year,month,day)),past=key<today,planned=data.tasks.some(task=>typeof task!=='string'&&task.dueDate===key),state=past?calendarTaskState(key):planned?'planned':'',classes=['calendar-day',past?'past':'',state,key===today?'today':'',key===calendarSelected?'selected':''].filter(Boolean).join(' ');return `<button class="${classes}" aria-label="${day} ${monthLabel}${planned?'. Есть задача':''}${state==='finished'?'. Все задачи выполнены':state==='missed'?'. Есть невыполненные задачи':''}" onclick="selectCalendarDay('${key}')">${day}${planned?'<span class="calendar-dot"></span>':''}</button>`}).join('');const selectedDate=new Date(`${calendarSelected}T00:00:00`),selectedLabel=new Intl.DateTimeFormat('ru-RU',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(selectedDate);modalContent.innerHTML=`<div class="calendar-heading"><h3>Календарь</h3><div class="calendar-nav"><button aria-label="Предыдущий месяц" onclick="changeCalendarMonth(-1)">‹</button><button aria-label="Следующий месяц" onclick="changeCalendarMonth(1)">›</button></div></div><div class="calendar-month-label">${monthLabel}</div><div class="calendar-weekdays">${weekdays}</div><div class="calendar-grid">${empty}${cells}</div><div class="calendar-legend"><span><i class="legend-dot"></i>Без событий</span><span><i class="legend-dot purple"></i>Запланировано</span><span><i class="legend-dot green"></i>Выполнено</span><span><i class="legend-dot red"></i>Не выполнено</span></div><div class="calendar-detail" id="calendarDetail">${calendarDayDetails(calendarSelected,selectedLabel)}</div><button class="calendar-close" onclick="closeModal()">Закрыть</button>`}
function changeCalendarMonth(amount){calendarMonth=new Date(calendarMonth.getFullYear(),calendarMonth.getMonth()+amount,1);calendarSelected=localDateKey(calendarMonth);renderCalendar()}
function selectCalendarDay(dateKey){calendarSelected=dateKey;renderCalendar()}
function calendarDayDetails(dateKey,label){const scheduled=data.tasks.filter(task=>typeof task!=='string'&&task.dueDate===dateKey),operations=data.operations.filter(operation=>operation.date&&localDateKey(new Date(operation.date))===dateKey);let html=`<h4>${label}</h4>`;if(!scheduled.length&&!operations.length)return html+'<div class="empty-state">На этот день ничего не запланировано и операций нет.</div>';if(scheduled.length){html+='<div class="calendar-item-meta">Задачи</div>';html+=scheduled.map(task=>{const done=taskDone(task),subs=taskSubtasks(task),subRows=subs.map(subtask=>`<div class="calendar-item-meta">${subtaskDone(subtask)?'✓':'○'} ${esc(subtaskText(subtask))} · ${subtaskDone(subtask)?'выполнено':dateKey<localDateKey(new Date())?'не выполнено':'запланировано'}</div>`).join('');return `<div class="calendar-item ${done?'done':'missed'}"><div class="calendar-item-title">${done?'✓':'○'} ${esc(taskText(task))}</div><div class="calendar-item-meta">${done?'Выполнено':dateKey<localDateKey(new Date())?'Не выполнено':'Запланировано'}</div>${subRows}</div>`}).join('')}if(operations.length){html+='<div class="calendar-item-meta" style="margin-top:10px">Операции</div>';html+=operations.map(operation=>`<div class="calendar-item"><div class="calendar-item-title">${esc(operation.icon||'')} ${esc(operation.name||'Операция')}</div><div class="calendar-item-meta">${operation.category?`${esc(operation.category)} · `:''}<span class="${operation.type==='minus'?'minus':'plus'}">${operation.type==='minus'?'Расход −':'Доход +'}${fmt(operation.amount)} ₽</span></div></div>`).join('')}return html}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>e.classList.remove('show'),1800)}
render();
todayDate.textContent=new Intl.DateTimeFormat('ru-RU',{weekday:'long',day:'numeric',month:'long'}).format(new Date());
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}
