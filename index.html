<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#292929">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon.svg">
<title>Приложуха — MVP</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#202020;font-family:Arial,Helvetica,sans-serif;color:#fff}
body{display:flex;justify-content:center}button,input{font:inherit}
button{color:inherit;border:0;cursor:pointer}
.app{width:min(100vw,430px);min-height:100vh;padding:28px 20px 22px;background:#303030;position:relative;overflow:hidden}
@media(min-width:700px){body{align-items:center;padding:24px}.app{min-height:760px;border-radius:18px;box-shadow:0 20px 70px #0008}}
.screen{display:none;min-height:calc(100vh - 50px);padding-bottom:92px}.screen.active{display:block}
.card,.tasks-card{background:#747474;border-radius:31px;padding:12px 20px 20px;margin-bottom:11px}
.title{font-weight:900;font-size:29px;line-height:1;margin:0 0 17px;letter-spacing:-1px}
.task-row{display:flex;align-items:center;gap:7px;min-height:41px;font-size:17px;font-weight:800}
.bullet{font-size:18px;width:9px}.task-text{flex:1}
.grid{display:grid;grid-template-columns:1fr 1.18fr;gap:11px}
.card{padding:15px 11px 12px;min-height:360px;display:flex;flex-direction:column}
.card h2{margin:0 0 10px;font-size:24px;line-height:.95;font-weight:900}
.goal{margin:0 0 7px;font-weight:900;font-size:17px;line-height:1.1}
.goal-money{font-size:11px;font-weight:800;margin-bottom:5px}
.progress{height:13px;background:#222;border-radius:20px;position:relative;margin:5px 0 17px;overflow:hidden}
.progress-fill{height:100%;border-radius:20px;background:linear-gradient(90deg,#22ee00,#ffe000);width:0}
.labels{display:flex;justify-content:space-between;font-size:8px;font-weight:700;margin-top:-12px;margin-bottom:12px}
.add-btn{margin-top:auto;width:100%;height:45px;border-radius:24px;background:#999;font-size:12px;font-weight:900}
.analytics{overflow:hidden}.chart{height:82px;width:100%;margin:0 0 8px;border:1px solid #999}
.chart svg{width:100%;height:100%}.ops{font-size:15px;font-weight:900;line-height:1.18;overflow:auto;max-height:170px}
.op{margin:0 0 11px}.minus{color:#ff7777}.plus{color:#70e980}
.bottom{position:absolute;left:20px;right:20px;bottom:22px;height:62px;border-radius:34px;background:#4e4e4e;display:flex;align-items:center;justify-content:space-around;border:1px solid #777}
.nav{width:48px;height:48px;border-radius:50%;background:transparent;display:grid;place-items:center}.nav svg{width:29px;height:29px;stroke:#aaa;stroke-width:1.4;fill:none}.nav.active{background:#5d5d5d}
.second .tasks-card{padding-top:12px}.second .tasks-card .title{text-align:center}
.second .task-row{min-height:59px}.task-actions{display:flex;gap:5px}
.action{width:39px;height:39px;border-radius:50%;display:grid;place-items:center;background:#666;border:1px solid #888;font-size:19px}
.delete{background:#765f60}.done{background:#5d8062}.edit{background:#817b5c}
.second .main-add{width:100%;height:47px;border-radius:24px;background:#999;font-size:20px;font-weight:900}
.hint{text-align:center;color:#aaa;font-size:11px;font-weight:700;margin-top:10px}
.modal-bg{position:fixed;inset:0;background:#0009;display:none;align-items:flex-end;justify-content:center;z-index:20}.modal-bg.show{display:flex}
.modal{width:min(430px,100vw);background:#3c3c3c;border-radius:28px 28px 0 0;padding:22px 20px 30px}
.modal h3{margin:0 0 15px;font-size:23px}.field{margin:9px 0}.field label{display:block;font-size:12px;font-weight:800;color:#bbb;margin-bottom:5px}
.field input{width:100%;border:1px solid #777;background:#252525;color:#fff;border-radius:13px;padding:12px;outline:none}
.modal-actions{display:flex;gap:9px;margin-top:16px}.modal-actions button{flex:1;height:45px;border-radius:23px;font-weight:900}.cancel{background:#666}.save{background:#888}
.type-buttons{display:flex;gap:8px}.type-buttons button{flex:1;height:43px;border-radius:22px;background:#555;font-weight:900}.type-buttons .selected.minus-type{background:#7b4747}.type-buttons .selected.plus-type{background:#477b50}
.toast{position:fixed;left:50%;bottom:98px;transform:translateX(-50%) translateY(20px);background:#111d;color:#fff;padding:10px 16px;border-radius:20px;font-size:13px;font-weight:700;opacity:0;pointer-events:none;transition:.2s;z-index:30;white-space:nowrap}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="app">
<section id="home" class="screen active">
  <div class="tasks-card"><h1 class="title">задачи</h1><div id="homeTasks"></div></div>
  <div class="grid">
    <div class="card"><h2>Цели</h2><div id="goals"></div><button class="add-btn" onclick="openGoal()">добавить цель</button></div>
    <div class="card analytics"><h2>Аналитика</h2>
      <div class="chart"><svg viewBox="0 0 240 82" preserveAspectRatio="none"><polyline points="0,62 22,42 45,50 67,27 89,70 112,43 134,49 156,20 179,30 201,12 224,35 240,22" fill="none" stroke="#bbb" stroke-width="1"/></svg></div>
      <div class="ops" id="operations"></div>
      <button class="add-btn" onclick="openOperation()">добавить операцию</button>
    </div>
  </div>
  <nav class="bottom">
    <button class="nav active" onclick="show('home')"><svg viewBox="0 0 32 32"><path d="M5 14 16 5l11 9v12H18v-8h-4v8H5z"/></svg></button>
    <button class="nav" onclick="show('tasks')"><svg viewBox="0 0 32 32"><path d="M6 17l6 6L27 8"/><rect x="4" y="4" width="24" height="24" rx="4"/></svg></button>
    <button class="nav" onclick="toast('Финансы — следующий экран')"><svg viewBox="0 0 32 32"><ellipse cx="16" cy="7" rx="10" ry="4"/><path d="M6 7v17c0 2 20 2 20 0V7M6 15c0 2 20 2 20 0"/></svg></button>
    <button class="nav" onclick="toast('Аналитика — следующий экран')"><svg viewBox="0 0 32 32"><path d="M6 26V6M6 26h21"/><path d="M8 21 13 16l4 3 8-10"/></svg></button>
    <button class="nav" onclick="toast('Дневник — следующий экран')"><svg viewBox="0 0 32 32"><path d="M6 5h15l5 5v17H6zM21 5v6h5M10 16h12M10 21h12"/></svg></button>
  </nav>
</section>

<section id="tasks" class="screen second">
  <div class="tasks-card"><h1 class="title">задачи</h1><div id="taskList"></div></div>
  <button class="main-add" onclick="addTask()">добавить задачу</button>
  <div class="hint">Нажми ✓, чтобы отметить задачу выполненной</div>
  <nav class="bottom">
    <button class="nav" onclick="show('home')"><svg viewBox="0 0 32 32"><path d="M5 14 16 5l11 9v12H18v-8h-4v8H5z"/></svg></button>
    <button class="nav active"><svg viewBox="0 0 32 32"><path d="M6 17l6 6L27 8"/><rect x="4" y="4" width="24" height="24" rx="4"/></svg></button>
    <button class="nav" onclick="toast('Финансы — следующий экран')"><svg viewBox="0 0 32 32"><ellipse cx="16" cy="7" rx="10" ry="4"/><path d="M6 7v17c0 2 20 2 20 0V7M6 15c0 2 20 2 20 0"/></svg></button>
    <button class="nav" onclick="toast('Аналитика — следующий экран')"><svg viewBox="0 0 32 32"><path d="M6 26V6M6 26h21"/><path d="M8 21 13 16l4 3 8-10"/></svg></button>
    <button class="nav" onclick="toast('Дневник — следующий экран')"><svg viewBox="0 0 32 32"><path d="M6 5h15l5 5v17H6zM21 5v6h5M10 16h12M10 21h12"/></svg></button>
  </nav>
</section>
</div>

<div class="modal-bg" id="modal"><div class="modal" id="modalContent"></div></div>
<div id="toast" class="toast"></div>

<script>
const defaults={tasks:['сделать домашку','сходить в зал','еще что нибудь'],goals:[],operations:[]};
let data=JSON.parse(localStorage.getItem('prilozhuhaData')||'null')||defaults;
function save(){localStorage.setItem('prilozhuhaData',JSON.stringify(data));render()}
function render(){
  homeTasks.innerHTML=data.tasks.slice(0,3).map(t=>`<div class="task-row"><span class="bullet">•</span><span class="task-text">${esc(t)}</span></div>`).join('');
  taskList.innerHTML=data.tasks.map((t,i)=>`<div class="task-row" data-i="${i}"><span class="bullet">•</span><span class="task-text ${t.done?'done-text':''}" style="${t.done?'text-decoration:line-through;opacity:.45':''}">${esc(t.text||t)}</span><span class="task-actions"><button class="action delete" onclick="removeTask(${i})">×</button><button class="action done" onclick="doneTask(${i})">✓</button><button class="action edit" onclick="editTask(${i})">⌕</button></span></div>`).join('');
  goals.innerHTML=data.goals.map((g,i)=>{let pct=Math.min(100,g.saved/g.price*100);return `<div class="goal">• ${esc(g.name)}</div><div class="goal-money">${fmt(g.saved)} / ${fmt(g.price)} ₽</div><div class="progress"><div class="progress-fill" style="width:${pct}%"></div></div>`}).join('');
  operations.innerHTML=data.operations.map(o=>`<p class="op ${o.type==='minus'?'minus':'plus'}">${o.type==='minus'?'−':'+'}${fmt(o.amount)} ₽<br>${esc(o.name)}</p>`).join('')||'<p class="op" style="color:#bbb">пока нет операций</p>';
}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function fmt(n){return Number(n).toLocaleString('ru-RU')}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active')}
function openGoal(){
 modalContent.innerHTML=`<h3>Новая цель</h3><div class="field"><label>Название</label><input id="gname" placeholder="Например, объектив"></div><div class="field"><label>Цена, ₽</label><input id="gprice" type="number" placeholder="20000"></div><div class="field"><label>Уже собрано, ₽</label><input id="gsaved" type="number" placeholder="0"></div><div class="modal-actions"><button class="cancel" onclick="closeModal()">Отмена</button><button class="save" onclick="saveGoal()">Добавить</button></div>`;modal.classList.add('show');gname.focus()
}
function saveGoal(){let name=gname.value.trim(),price=+gprice.value,saved=+gsaved.value||0;if(!name||!price){toast('Заполни название и цену');return}data.goals.push({name,price,saved});closeModal();save();toast('Цель добавлена')}
function openOperation(){
 modalContent.innerHTML=`<h3>Новая операция</h3><div class="field"><label>Тип операции</label><div class="type-buttons"><button id="minusBtn" class="selected minus-type" onclick="setType('minus')">− расход</button><button id="plusBtn" class="plus-type" onclick="setType('plus')">+ доход</button></div></div><div class="field"><label>Название</label><input id="oname" placeholder="Например, Бургер Кинг"></div><div class="field"><label>Сумма, ₽</label><input id="oamount" type="number" placeholder="200"></div><div class="modal-actions"><button class="cancel" onclick="closeModal()">Отмена</button><button class="save" onclick="saveOperation()">Добавить</button></div>`;window.opType='minus';modal.classList.add('show')
}
function setType(t){window.opType=t;minusBtn.classList.toggle('selected',t==='minus');plusBtn.classList.toggle('selected',t==='plus')}
function saveOperation(){let name=oname.value.trim(),amount=+oamount.value;if(!name||!amount){toast('Заполни название и сумму');return}data.operations.unshift({name,amount,type:window.opType});closeModal();save();toast('Операция добавлена')}
function closeModal(){modal.classList.remove('show')}
function addTask(){let name=prompt('Название новой задачи:');if(name&&name.trim()){data.tasks.push(name.trim());save();toast('Задача добавлена')}}
function removeTask(i){data.tasks.splice(i,1);save();toast('Задача удалена')}
function doneTask(i){let t=data.tasks[i];if(typeof t==='string')data.tasks[i]={text:t,done:true};else t.done=!t.done;save();toast('Статус задачи изменён')}
function editTask(i){let t=data.tasks[i],old=typeof t==='string'?t:t.text;let n=prompt('Измени задачу:',old);if(n&&n.trim()){data.tasks[i]=typeof t==='string'?n.trim():{...t,text:n.trim()};save()}}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>e.classList.remove('show'),1800)}
render();
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}
</script>
</body>
</html>
